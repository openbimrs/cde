name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.99.1 gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned external OpenCDE sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/opencde"
          for source in foundation-API documents-API; do
            git init "$root/$source"
            git -C "$root/$source" remote add origin "https://github.com/buildingSMART/$source.git"
          done
          git -C "$root/foundation-API" fetch --depth=1 origin 2c552eae435d575f1df7c11ff9ea19e3d2a324ce
          git -C "$root/foundation-API" checkout --detach FETCH_HEAD
          git -C "$root/documents-API" fetch --depth=1 origin 938bd7636e094c2dc3c65ad6dae846ac3c7b6a9b
          git -C "$root/documents-API" checkout --detach FETCH_HEAD
          test "$(git -C "$root/foundation-API" rev-parse HEAD)" = 2c552eae435d575f1df7c11ff9ea19e3d2a324ce
          test "$(git -C "$root/documents-API" rev-parse HEAD)" = 938bd7636e094c2dc3c65ad6dae846ac3c7b6a9b
          printf 'OPENCDE_REFERENCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run verified gate
        run: ./scripts/gate.sh

  supply-chain:
    name: Dependency advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
