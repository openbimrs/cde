[package]
name = "openbim-cde-oauth"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
authors = ["OpenBIM.rs contributors"]
repository = "https://github.com/openbimrs/cde"
readme = "README.md"
description = "Secure OAuth execution and token storage for buildingSMART openCDE APIs."
publish = false
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSES/MIT.txt",
]

[features]
default = []
native-keyring = ["dep:keyring"]
reqwest = ["dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
http = "1"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "linux-native", "windows-native"], optional = true }
oauth2 = { version = "5.0", default-features = false }
openbim-cde = { version = "=0.1.0", path = "../openbim-cde" }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", optional = true, features = ["net"] }
url = "2"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
