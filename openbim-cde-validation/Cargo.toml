[package]
name = "openbim-cde-validation"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/cde"
readme = "README.md"
description = "Runtime validation for caller-supplied openCDE schemas."
publish = false
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSES/MIT.txt",
]

[dependencies]
base64 = "0.22"
jsonschema = { version = "0.29.1", default-features = false }
openbim-cde = { version = "0.1.0", path = "../openbim-cde" }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
