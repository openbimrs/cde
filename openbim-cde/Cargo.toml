[package]
name = "openbim-cde"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/cde"
readme = "README.md"
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
]
description = "buildingSMART openCDE Foundation and Documents API wire contracts."
publish = false
keywords = ["bim", "openbim", "cde", "aec"]
categories = ["api-bindings", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
